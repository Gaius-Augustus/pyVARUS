<text x="28" y="242" font-size="11" fill="#444" text-anchor="start">Threads: minimap2 gets --threads minus the scanners and one core for main + downloads; groups = 1 per ~15 minimap2 threads (1–4, fewer if the index copies do not fit in memory).</text>
